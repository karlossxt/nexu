<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
<title id="title">Zero Vial</title>
<desc id="desc">Logotipo Zero Vial con letra Z, vehículo estilizado y acentos cian y azul.</desc>
<defs>
  <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#16E7F3"/>
    <stop offset=".52" stop-color="#0AA8FF"/>
    <stop offset="1" stop-color="#1458FF"/>
  </linearGradient>
  <linearGradient id="speed" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#16E7F3"/>
    <stop offset="1" stop-color="#1458FF"/>
  </linearGradient>
</defs>
<rect x="14" y="14" width="484" height="484" rx="42" fill="#000" stroke="url(#frame)" stroke-width="18"/>
<!-- Z principal -->
<path d="M65 108H421L335 218H213L154 292H329V397H80V320L157 222H65Z" fill="#F7F7F7"/>
<!-- vehículo estilizado -->
<path d="M76 330L147 286L185 313L214 361L237 382L222 411H170L148 381H111L76 362Z" fill="#000"/>
<circle cx="150" cy="390" r="42" fill="#000"/>
<circle cx="150" cy="390" r="22" fill="#F7F7F7"/>
<path d="M84 323L125 298L143 320L105 345Z" fill="#F7F7F7"/>
<!-- línea de movimiento -->
<rect x="235" y="310" width="134" height="18" rx="9" fill="#000"/>
<!-- acentos de velocidad -->
<path d="M309 270H425L402 290H288Z" fill="url(#speed)"/>
<path d="M286 300H401L378 320H266Z" fill="url(#speed)"/>
</svg>